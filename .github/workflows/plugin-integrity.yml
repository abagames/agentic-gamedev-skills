name: Plugin distribution integrity
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tools/check-readme-skills.sh
      - run: bash tools/tests/test-repository-tools.sh
      - run: bash tools/tests/test-plugin-bundles.sh
      - run: git diff --check
